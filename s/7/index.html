</div>
<script>
// Pages 의 10분 HTML 캐시로 죽은 주소로 가지 않도록, 항상 현재 주소(target.txt)를 읽어 이동
(function(){
  var fb = "https://britain-agree-achieved-orchestra.trycloudflare.com/s/7", tail = "s/7", q = location.search + location.hash;
  var depth = tail ? tail.split('/').length : 0, up = '';
  for (var i = 0; i < depth; i++) up += '../';
  function go(base){ var u = base.replace(/\/$/, '') + (tail ? '/' + tail : '') + q;
    try{ document.getElementById('go').href = u; }catch(e){} location.replace(u); }
  try {
    var x = new XMLHttpRequest();
    x.open('GET', up + 'target.txt?t=' + Date.now(), true);
    x.timeout = 5000;
    x.onload = function(){ var u = (x.responseText || '').trim();
      go(/^https:\/\//.test(u) ? u : fb.replace('/' + tail, '')); };
    x.onerror = x.ontimeout = function(){ location.replace(fb + q); };
    x.send();
  } catch(e) { location.replace(fb + q); }
})();
</script>
